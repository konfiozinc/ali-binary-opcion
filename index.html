<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alí Binary Options Pro</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a0f1e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #070c1a;
      --surface:  #0d1426;
      --border:   rgba(0,212,255,0.15);
      --accent:   #00d4ff;
      --accent2:  #00ff88;
      --call:     #00ff88;
      --put:      #ff3366;
      --text:     #e8f4f8;
      --muted:    #7a9ab5;
      --glass:    rgba(13,20,38,0.85);
      --radius:   14px;
      --glow:     0 0 30px rgba(0,212,255,0.3);
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── FONDO ANIMADO ── */
    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(0,212,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: grid-move 20s linear infinite;
    }
    @keyframes grid-move { to { background-position: 40px 40px; } }

    .orb {
      position: fixed; border-radius: 50%; filter: blur(80px); z-index: 0; pointer-events: none;
    }
    .orb-1 { width: 400px; height: 400px; background: rgba(0,212,255,0.08); top: -100px; left: -100px; animation: float1 8s ease-in-out infinite; }
    .orb-2 { width: 300px; height: 300px; background: rgba(0,255,136,0.06); bottom: -80px; right: -80px; animation: float2 10s ease-in-out infinite; }
    @keyframes float1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(30px,20px)} }
    @keyframes float2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-20px,-30px)} }

    /* ── TARJETA PRINCIPAL ── */
    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      margin: 20px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 44px 36px 36px;
      backdrop-filter: blur(20px);
      box-shadow: 0 0 60px rgba(0,212,255,0.08), 0 20px 60px rgba(0,0,0,0.5);
      animation: card-in 0.6s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── LOGO ── */
    .logo-block {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 100px; height: 100px;
      margin: 0 auto 12px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      animation: icon-pulse 3s ease-in-out infinite;
    }
    .logo-icon img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    @keyframes icon-pulse {
      0%,100% { box-shadow: 0 0 30px rgba(0,212,255,0.4); }
      50%      { box-shadow: 0 0 50px rgba(0,212,255,0.7); }
    }
    .logo-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #00d4ff, #00ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo-sub {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ── TABS ── */
    .tabs {
      display: flex;
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 28px;
      gap: 4px;
    }
    .tab-btn {
      flex: 1; padding: 10px;
      background: none; border: none;
      color: var(--muted);
      font-family: 'Orbitron', sans-serif;
      font-size: 11px; font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      border-radius: 7px;
      transition: all 0.25s;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, rgba(0,212,255,0.2), rgba(0,255,136,0.1));
      color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(0,212,255,0.3);
    }

    /* ── FORMULARIO ── */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; animation: fade-in 0.3s ease; }
    @keyframes fade-in { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    .field { margin-bottom: 18px; }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .field input {
      width: 100%;
      background: rgba(0,0,0,0.35);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 16px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,212,255,0.12);
    }
    .field input::placeholder { color: rgba(122,154,181,0.5); }

    /* ── BOTÓN ── */
    .btn-primary {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #00d4ff, #00ff88);
      border: none;
      border-radius: 12px;
      color: #070c1a;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px; font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      margin-top: 4px;
      transition: all 0.25s;
      position: relative;
      overflow: hidden;
    }
    .btn-primary::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,212,255,0.4); }
    .btn-primary:hover::after { opacity: 1; }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ── RECUPERAR CONTRASEÑA ── */
    .forgot {
      text-align: right;
      margin-top: -10px;
      margin-bottom: 18px;
    }
    .forgot a {
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
      opacity: 0.8;
      transition: opacity 0.2s;
    }
    .forgot a:hover { opacity: 1; }

    /* ── ERROR ── */
    .error-msg {
      display: none;
      background: rgba(255,51,102,0.1);
      border: 1px solid rgba(255,51,102,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--put);
      margin-bottom: 16px;
      text-align: center;
    }
    .success-msg {
      display: none;
      background: rgba(0,255,136,0.1);
      border: 1px solid rgba(0,255,136,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--call);
      margin-bottom: 16px;
      text-align: center;
    }

    /* ── MODAL RECUPERAR ── */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 28px;
      width: 100%; max-width: 360px;
      margin: 20px;
      box-shadow: 0 0 40px rgba(0,212,255,0.15);
      animation: card-in 0.3s ease;
    }
    .modal-box h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 15px;
      color: var(--accent);
      margin-bottom: 16px;
    }
    .modal-box p { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
    .btn-outline {
      flex: 1; padding: 12px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-family: 'Orbitron', sans-serif;
      font-size: 11px; font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

    .footer-note {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-top: 24px;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="card">
    <div class="logo-block">
      <div class="logo-icon"><img src="assets/logo.png" alt="Alí Binary Options Pro" /></div>
      <div class="logo-title">ALÍ BINARY OPTIONS PRO</div>
      <div class="logo-sub">Señales Premium en Tiempo Real</div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="login"    onclick="switchTab('login')">INICIAR SESIÓN</button>
      <button class="tab-btn"        data-tab="register" onclick="switchTab('register')">REGISTRO</button>
    </div>

    <!-- LOGIN -->
    <div id="tab-login" class="tab-panel active">
      <div id="login-error"   class="error-msg"></div>
      <div id="login-success" class="success-msg"></div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="tu@email.com" />
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="login-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter') doLogin()" />
      </div>
      <div class="forgot"><a href="#" onclick="openReset(); return false">¿Olvidaste tu contraseña?</a></div>
      <button class="btn-primary" id="btn-login" onclick="doLogin()">ENTRAR</button>
    </div>

    <!-- REGISTRO -->
    <div id="tab-register" class="tab-panel">
      <div id="reg-error"   class="error-msg"></div>
      <div id="reg-success" class="success-msg"></div>
      <div class="field">
        <label>Nombre</label>
        <input type="text" id="reg-nombre" placeholder="Tu nombre" />
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="tu@email.com" />
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="reg-pass" placeholder="Mínimo 6 caracteres" onkeydown="if(event.key==='Enter') doRegister()" />
      </div>
      <button class="btn-primary" id="btn-register" onclick="doRegister()">CREAR CUENTA</button>
    </div>

    <div class="footer-note">🔒 Conexión segura · Firebase SSL</div>
  </div>

  <!-- MODAL RESET PASSWORD -->
  <div class="modal-overlay" id="reset-modal">
    <div class="modal-box">
      <h3>🔑 RECUPERAR CONTRASEÑA</h3>
      <p>Ingresa tu email y te enviaremos un enlace de recuperación.</p>
      <div id="reset-error"   class="error-msg"></div>
      <div id="reset-success" class="success-msg"></div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="reset-email" placeholder="tu@email.com" />
      </div>
      <div class="modal-actions">
        <button class="btn-outline" onclick="closeReset()">CANCELAR</button>
        <button class="btn-primary" id="btn-reset" onclick="doReset()" style="flex:1">ENVIAR</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/roles.js"></script>

  <script>
    // Si ya hay sesión activa, redirigir
    auth.onAuthStateChanged(user => {
      if (user) redirectByRole(user);
    });

    function switchTab(tab) {
      document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.getElementById("tab-" + tab).classList.add("active");
      document.querySelector(`[data-tab="${tab}"]`).classList.add("active");
    }

    async function doLogin() {
      const btn   = document.getElementById("btn-login");
      const email = document.getElementById("login-email").value.trim();
      const pass  = document.getElementById("login-pass").value;
      const errEl = document.getElementById("login-error");
      const sucEl = document.getElementById("login-success");

      errEl.style.display = "none";
      sucEl.style.display = "none";

      if (!email || !pass) { errEl.textContent = "Completa todos los campos."; errEl.style.display = "block"; return; }

      btn.disabled = true; btn.textContent = "VERIFICANDO…";
      const res = await loginUser(email, pass);
      if (res.success) {
        sucEl.textContent = "✅ Autenticado. Redirigiendo…";
        sucEl.style.display = "block";
        await redirectByRole(res.user);
      } else {
        errEl.textContent = res.error;
        errEl.style.display = "block";
        btn.disabled = false; btn.textContent = "ENTRAR";
      }
    }

    async function doRegister() {
      const btn    = document.getElementById("btn-register");
      const nombre = document.getElementById("reg-nombre").value.trim();
      const email  = document.getElementById("reg-email").value.trim();
      const pass   = document.getElementById("reg-pass").value;
      const errEl  = document.getElementById("reg-error");
      const sucEl  = document.getElementById("reg-success");

      errEl.style.display = "none";
      sucEl.style.display = "none";

      if (!nombre || !email || !pass) { errEl.textContent = "Completa todos los campos."; errEl.style.display = "block"; return; }

      btn.disabled = true; btn.textContent = "CREANDO…";
      const res = await registerUser(email, pass, nombre);
      if (res.success) {
        sucEl.textContent = "✅ Cuenta creada. Accediendo…";
        sucEl.style.display = "block";
        await redirectByRole(res.user);
      } else {
        errEl.textContent = res.error;
        errEl.style.display = "block";
        btn.disabled = false; btn.textContent = "CREAR CUENTA";
      }
    }

    function openReset()  { document.getElementById("reset-modal").classList.add("open"); }
    function closeReset() { document.getElementById("reset-modal").classList.remove("open"); }

    async function doReset() {
      const btn   = document.getElementById("btn-reset");
      const email = document.getElementById("reset-email").value.trim();
      const errEl = document.getElementById("reset-error");
      const sucEl = document.getElementById("reset-success");
      errEl.style.display = "none"; sucEl.style.display = "none";

      if (!email) { errEl.textContent = "Ingresa tu email."; errEl.style.display = "block"; return; }
      btn.disabled = true; btn.textContent = "ENVIANDO…";
      const res = await resetPassword(email);
      if (res.success) {
        sucEl.textContent = "✅ Revisa tu bandeja de entrada.";
        sucEl.style.display = "block";
      } else {
        errEl.textContent = res.error;
        errEl.style.display = "block";
      }
      btn.disabled = false; btn.textContent = "ENVIAR";
    }
  </script>
</body>
</html>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  }
</script>
