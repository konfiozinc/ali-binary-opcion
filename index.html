<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ali Binary Options PRO — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #f59e0b;
  --gold2: #fbbf24;
  --orange: #f97316;
  --green: #10b981;
  --red: #ef4444;
  --bg: #040911;
  --surface: rgba(15,22,40,0.85);
  --border: rgba(245,158,11,0.15);
  --text: #e2e8f0;
  --muted: #64748b;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Syne', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
.bg-grid {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(245,158,11,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(245,158,11,0.04) 1px, transparent 1px);
  background-size: 40px 40px;
  z-index: 0;
}
.bg-glow {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 20%, rgba(245,158,11,0.08), transparent),
    radial-gradient(ellipse 50% 50% at 80% 80%, rgba(16,185,129,0.06), transparent),
    radial-gradient(ellipse 80% 60% at 50% 50%, rgba(249,115,22,0.04), transparent);
  z-index: 0;
}
/* Floating particles */
.particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.particle {
  position: absolute;
  width: 2px; height: 2px;
  background: var(--gold);
  border-radius: 50%;
  animation: float linear infinite;
  opacity: 0;
}
@keyframes float {
  0% { transform: translateY(100vh) scale(0); opacity: 0; }
  10% { opacity: 0.6; }
  90% { opacity: 0.2; }
  100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
}
.wrap {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 440px;
  padding: 20px;
  animation: fadeUp 0.7s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(0); }
}
.brand {
  text-align: center;
  margin-bottom: 40px;
}
.brand-icon {
  width: 72px; height: 72px;
  border-radius: 22px;
  background: linear-gradient(135deg, var(--gold), var(--orange));
  display: flex; align-items: center; justify-content: center;
  font-size: 34px;
  margin: 0 auto 18px;
  box-shadow: 0 0 40px rgba(245,158,11,0.35);
  animation: iconPulse 3s ease-in-out infinite;
}
@keyframes iconPulse {
  0%,100% { box-shadow: 0 0 30px rgba(245,158,11,0.3); }
  50%      { box-shadow: 0 0 60px rgba(245,158,11,0.55); }
}
.brand h1 {
  font-size: 28px; font-weight: 800;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, #fff 40%, var(--gold));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.brand p {
  color: var(--muted); font-size: 13px; margin-top: 6px;
  font-family: 'DM Mono', monospace; letter-spacing: 1px;
}
.live-badge {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 12px; border-radius: 999px;
  background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3);
  font-size: 11px; color: var(--green); font-family: 'DM Mono', monospace;
  margin-top: 12px; letter-spacing: 1px;
}
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green);
  box-shadow: 0 0 8px var(--green); animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.6);} }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 28px;
  padding: 36px 32px;
  backdrop-filter: blur(20px);
  box-shadow: 0 25px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
}
.tabs {
  display: flex; gap: 6px;
  background: rgba(0,0,0,0.3); border-radius: 14px; padding: 5px;
  margin-bottom: 28px;
}
.tab {
  flex: 1; padding: 11px; border-radius: 10px; border: none;
  font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all 0.25s; color: var(--muted);
  background: transparent; letter-spacing: 0.5px;
}
.tab.active { background: linear-gradient(135deg, var(--gold), var(--orange)); color: #000; }
.form-group { margin-bottom: 18px; }
.form-group label {
  display: block; font-size: 12px; font-weight: 700; letter-spacing: 1px;
  color: var(--muted); margin-bottom: 8px; font-family: 'DM Mono', monospace;
  text-transform: uppercase;
}
.form-group input {
  width: 100%; padding: 14px 18px;
  background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.07);
  border-radius: 14px; color: var(--text); font-size: 15px;
  font-family: 'DM Mono', monospace; outline: none; transition: border 0.2s;
}
.form-group input:focus { border-color: rgba(245,158,11,0.5); }
.form-group input::placeholder { color: rgba(100,116,139,0.5); }
.btn-enter {
  width: 100%; padding: 16px; border: none; border-radius: 16px;
  font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 800;
  cursor: pointer; transition: all 0.3s; letter-spacing: 0.5px;
  background: linear-gradient(135deg, var(--gold), var(--orange));
  color: #000; margin-top: 8px;
  box-shadow: 0 8px 30px rgba(245,158,11,0.3);
}
.btn-enter:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(245,158,11,0.45); }
.btn-enter:active { transform: translateY(0); }
.btn-user {
  background: linear-gradient(135deg, var(--green), #059669);
  box-shadow: 0 8px 30px rgba(16,185,129,0.25);
  color: #fff;
}
.btn-user:hover { box-shadow: 0 12px 40px rgba(16,185,129,0.4); }
.error-msg {
  color: var(--red); font-size: 13px; margin-top: 10px;
  text-align: center; font-family: 'DM Mono', monospace;
  display: none; padding: 10px; background: rgba(239,68,68,0.1);
  border-radius: 10px; border: 1px solid rgba(239,68,68,0.2);
}
#userPanel { display: none; text-align: center; }
#userPanel p { color: var(--muted); font-size: 14px; margin-bottom: 24px; line-height: 1.6; }
.footer-note {
  text-align: center; margin-top: 20px;
  color: var(--muted); font-size: 11px; font-family: 'DM Mono', monospace;
}
/* Admin credentials hint */
.robot-login {
  animation: robotFloat 3s ease-in-out infinite;
  filter: drop-shadow(0 0 16px rgba(0,180,216,0.45));
  display: flex; justify-content: center; margin-bottom: 12px;
}
@keyframes robotFloat {
  0%,100%{transform:translateY(0) rotate(-3deg);}
  50%{transform:translateY(-10px) rotate(3deg);}
}
.hint { font-size: 11px; color: rgba(100,116,139,0.4); text-align:center; margin-top:8px; font-family:'DM Mono',monospace; }
</style>
</head>

      <div class="form-group">

<script>
// Particles
const pc = document.getElementById('particles');
for(let i=0;i<25;i++){
  const p = document.createElement('div');
  p.className='particle';
  p.style.left = Math.random()*100+'%';
  p.style.animationDuration = (8+Math.random()*12)+'s';
  p.style.animationDelay = (-Math.random()*20)+'s';
  p.style.width = p.style.height = (1+Math.random()*3)+'px';
  pc.appendChild(p);
}

function showTab(t){
  document.getElementById('adminPanel').style.display = t==='admin'?'block':'none';
  document.getElementById('userPanel').style.display = t==='user'?'block':'none';
  document.getElementById('tabAdmin').classList.toggle('active', t==='admin');
  document.getElementById('tabUser').classList.toggle('active', t==='user');
}

function loginAdmin(){
  const email = document.getElementById('adminEmail').value;
  const pass  = document.getElementById('adminPass').value;
  const err   = document.getElementById('adminError');
  if(email==='admin@alibinary.com' && pass==='admin123'){
    err.style.display='none';
    sessionStorage.setItem('ali_role','admin');
    window.location.href='admin.html';
  } else {
    err.style.display='block';
  }
}

function loginUser(){
  sessionStorage.setItem('ali_role','user');
  window.location.href='sala.html';
}

document.addEventListener('keydown', e => {
  if(e.key==='Enter') {
    const tab = document.getElementById('tabAdmin').classList.contains('active');
    if(tab) loginAdmin(); else loginUser();
  }
});
</script>
